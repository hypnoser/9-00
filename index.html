    <a

      title="Про загальнонаціональну хвилину мовчання"
      aria-label="Відкрити інформаційну сторінку про загальнонаціональну хвилину мовчання"
    >i</a>

    <script>
      (() => {
        "use strict";

        const POSTER_WIDTH = 640;
        const POSTER_HEIGHT = 900;
        const TEST_DURATION_MS = 60_000;
        const isTestMode = new URLSearchParams(window.location.search).get("test") === "1";

        const poster = document.getElementById("poster");
        const clock = document.getElementById("clock");
        const status = document.getElementById("status");
        const testBadge = document.getElementById("test-badge");
        const metronomeAudio = document.getElementById("metronome-audio");
        const flagCanvas = document.getElementById("flag-canvas");
        const flagContext = flagCanvas.getContext("2d");
        const flagImage = new Image();
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        metronomeAudio.volume = 0.82;

        flagImage.decoding = "async";
        flagImage.src = "assets/realistic-ukrainian-flag.png";

        const kyivClock = new Intl.DateTimeFormat("uk-UA", {
          timeZone: "Europe/Kyiv",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23",
        });

        let testStartedAt = performance.now();
        let previousTestSecond = -1;
        let previousKyivSecond = "";
        let wasActive = false;
        let flagWasDrawn = false;
        let lastFlagDrawAt = Number.NEGATIVE_INFINITY;

        function fitPoster() {
          const viewportWidth = document.documentElement.clientWidth;
          const viewportHeight = document.documentElement.clientHeight;
          const scale = Math.min(viewportWidth / POSTER_WIDTH, viewportHeight / POSTER_HEIGHT);
          poster.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        function drawFlag(timestamp, active) {
          if (!active) {
            if (flagWasDrawn) {
              flagContext.clearRect(0, 0, flagCanvas.width, flagCanvas.height);
              flagWasDrawn = false;
              lastFlagDrawAt = Number.NEGATIVE_INFINITY;
            }
            return;
          }

          if (!flagImage.complete || !flagImage.naturalWidth) return;
          if (reduceMotion && Number.isFinite(lastFlagDrawAt)) return;
          if (!reduceMotion && timestamp - lastFlagDrawAt < 33) return;

          lastFlagDrawAt = timestamp;
          flagWasDrawn = true;

          const width = flagCanvas.width;
          const height = flagCanvas.height;
          const strips = 84;
          const sourceStrip = flagImage.naturalWidth / strips;
          const imageRatio = flagImage.naturalWidth / flagImage.naturalHeight;
          const flagWidth = width * 0.98;
          const destinationStrip = flagWidth / strips;
          const flagHeight = Math.min(flagWidth / imageRatio, height * 0.94);
          const baseX = (width - flagWidth) / 2;
          const baseY = (height - flagHeight) / 2;
          const motionTime = reduceMotion ? 0 : timestamp * 0.001;

          flagContext.clearRect(0, 0, width, height);

          for (let index = 0; index < strips; index += 1) {
            const progress = index / (strips - 1);
            const freedom = 0.03 + Math.pow(progress, 0.82) * 0.97;
            const phase = motionTime * 1.45 - progress * 5.8;
            const verticalWave =
              (Math.sin(phase) * 18 + Math.sin(motionTime * 2.35 + progress * 9.2) * 4.5) *
              freedom;
            const heightScale = 1 + Math.cos(phase + 0.55) * 0.024 * freedom;
            const horizontalDrift = Math.sin(phase * 0.72) * 4 * freedom;
            const brightness = 0.8 + (Math.cos(phase + 0.35) + 1) * 0.1;

            flagContext.filter = `brightness(${brightness})`;
            flagContext.drawImage(
              flagImage,
              index * sourceStrip,
              0,
              sourceStrip + 0.8,
              flagImage.naturalHeight,
              baseX + index * destinationStrip - 1 + horizontalDrift,
              baseY + verticalWave,
              destinationStrip + 3,
              flagHeight * heightScale,
            );
          }

          flagContext.filter = "none";
          flagContext.globalCompositeOperation = "source-atop";
          const fabricLight = flagContext.createLinearGradient(0, 0, width, 0);
          fabricLight.addColorStop(0, "rgba(255,255,255,0.01)");
          fabricLight.addColorStop(0.35, "rgba(255,255,255,0.08)");
          fabricLight.addColorStop(0.7, "rgba(0,0,0,0.06)");
          fabricLight.addColorStop(1, "rgba(0,0,0,0.18)");
          flagContext.fillStyle = fabricLight;
          flagContext.fillRect(0, 0, width, height);
          flagContext.globalCompositeOperation = "source-over";
        }

        function soundMetronome() {
          try {
            metronomeAudio.currentTime = 0;
            const playback = metronomeAudio.play();
            if (playback) playback.catch(() => {});
          } catch (_) {
            // Звук стане доступним після першої взаємодії з браузером.
          }
        }

        async function unlockAudio(playConfirmation = false) {
          const originalVolume = metronomeAudio.volume;
          try {
            metronomeAudio.volume = 0;
            metronomeAudio.currentTime = 0;
            await metronomeAudio.play();
            metronomeAudio.pause();
            metronomeAudio.currentTime = 0;
            metronomeAudio.volume = originalVolume;
            if (playConfirmation && document.body.classList.contains("is-active")) {
              soundMetronome();
            }
          } catch (_) {
            // Браузер сам вирішує, чи дозволяти звук без взаємодії користувача.
          } finally {
            metronomeAudio.volume = originalVolume;
          }
        }

        function kyivParts(date) {
          return Object.fromEntries(
            kyivClock
              .formatToParts(date)
              .filter((part) => part.type !== "literal")
              .map((part) => [part.type, part.value]),
          );
        }

        function setActive(active) {
          document.body.classList.toggle("is-active", active);
          if (active !== wasActive) {
            status.textContent = active
              ? "Розпочалася загальнонаціональна хвилина мовчання"
              : "Хвилина мовчання завершилася";
            wasActive = active;
          }
        }

        function setFlagVisible(visible) {
          document.body.classList.toggle("show-flag", visible);
        }

        function update() {
          const now = new Date();
          const parts = kyivParts(now);
          let active = false;
          let flagVisible = false;

          if (isTestMode) {
            const elapsed = performance.now() - testStartedAt;
            active = elapsed >= 0 && elapsed < TEST_DURATION_MS;
            flagVisible = active && elapsed < 58_000;

            if (active) {
              clock.textContent = "09:00";
              const testSecond = Math.floor(elapsed / 1000);
              if (testSecond !== previousTestSecond) {
                previousTestSecond = testSecond;
                if (testSecond % 2 === 0) soundMetronome();
              }
            } else {
              clock.textContent = `${parts.hour}:${parts.minute}`;
            }
          } else {
            clock.textContent = `${parts.hour}:${parts.minute}`;
            active = parts.hour === "09" && parts.minute === "00";
            flagVisible = active && Number(parts.second) < 58;

            if (active) {
              const second = Number(parts.second);
              const kyivSecond = `${parts.hour}:${parts.minute}:${parts.second}`;
              if (kyivSecond !== previousKyivSecond) {
                previousKyivSecond = kyivSecond;
                if (second % 2 === 0) soundMetronome();
              }
            } else {
              previousKyivSecond = "";
            }
          }

          setActive(active);
          setFlagVisible(flagVisible);
          drawFlag(performance.now(), active);
          window.requestAnimationFrame(update);
        }

        async function restartTest() {
          await unlockAudio(false);
          testStartedAt = performance.now();
          previousTestSecond = -1;
        }

        fitPoster();
        window.addEventListener("resize", fitPoster, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fitPoster, { passive: true });
        }

        document.addEventListener("pointerdown", () => unlockAudio(false), { once: true });
        document.addEventListener("keydown", () => unlockAudio(false), { once: true });

        if (isTestMode) {
          testBadge.classList.add("is-visible");
          testBadge.addEventListener("click", restartTest);
          unlockAudio(false);
        }

        update();
      })();
    </script>
